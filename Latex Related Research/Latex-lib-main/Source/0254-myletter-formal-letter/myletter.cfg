% Letterhead configuration owned by this starter, not a copy of akletter.cfg.
\makeatletter
\sbox{\FIRM}{\parbox[t]{\leftfield}{\bfseries\fontsize{15}{19pt}\selectfont
  Northbridge Research Cooperative}}
\sbox{\firm}{\fontsize{10}{12pt}\selectfont Northbridge Research Cooperative}
\sbox{\firmaddress}{\parbox[t]{\rightfield}{\fontsize{9}{10pt}\selectfont
  14 Meridian Walk\\Bristol BS1 4QX\\United Kingdom}}
\sbox{\FIRMHEAD}{\usebox{\FIRM}\raisebox{3mm}{\usebox{\firmaddress}}}
\sbox{\firmreturn}{\underline{\fontsize{7}{8pt}\selectfont
  Northbridge Research Cooperative \,\textperiodcentered\, 14 Meridian Walk
  \,\textperiodcentered\, Bristol BS1 4QX}}
% akletter's example cfg normally supplies this companion box.  Keep the
% useful contact panel while avoiding the example's placeholder data.
\def\rightbox{\parbox[t]{\rightfield}{\fontsize{9}{11pt}\selectfont
  \raggedright
  \fromname\\
  Telephone: \telephonenum\\[1.5ex]
  e-mail: \@email}}
\makeatother
